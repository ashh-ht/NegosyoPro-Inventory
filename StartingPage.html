<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NegosyoPro Sign Up</title>
    <link rel="stylesheet" href="StartingPageCSS.css" th:href="@{/StartingPageCSS.css}">
</head>
<body>
    <div class="main-container">

        <div class="left-panel-SignUp">
            <h2>Welcome Back to NegosyoPro!</h2>
            <p>Do you already have an account?</p>
            <button class="sign-in-btn">Sign in</button>
        </div>

        <div class="right-panel-SignUp">
            <h2>Create Account</h2>
            <form action="#" th:action="@{/signup}">
                <div class="input-group">
                    <label for="first-name">First name</label>
                    <input type="text" id="first-name" name="first-name" th:value="${firstName}">
                </div>
                
                <div class="input-group">
                    <label for="last-name">Last name</label>
                    <input type="text" id="last-name" name="last-name" th:value="${lastName}">
                </div>
                
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" th:value="${username}">
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" th:value="${password}">
                </div>
                
                <div class="input-group">
                    <label for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password" name="confirm-password" th:value="${confirmPassword}">
                </div>
                
                <button type="submit" class="create-btn">Create Account</button>
            </form>
        </div>

    </div>
</body>
</html>
