<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NegosyoPro My Account</title>
    <link rel="stylesheet" href="DashboardCSS.css">
</head>
<body>
    <div class="dashboard-container">
        
        <div class="sidebar">
            <div class="sidebar-header">Business Name</div>
            <ul class="nav-menu">
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Sales/POS</a></li>
                <li><a href="#">Suppliers</a></li>
                <li><a href="#">Reports</a></li>
                <li><a href="#">Settings</a></li>
                <li class="active"><a href="#">My Account</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" class="logout-link">Logout</a>
                <span class="brand-text">NegosyoPro</span>
            </div>
        </div>

        <div class="main-content">
            <div class="top-header">
                <h1>My Account</h1>
                <div class="user-profile">
                    <span class="user-icon">(Icon Here)</span> Owner
                </div>
            </div>
            
            <div class="form-section">
                <h2>Basic Information</h2>
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>Role (View Only)</label>
                    <input type="text" disabled>
                </div>
            </div>

            <div class="form-section">
                <h2>Change Password</h2>
                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password">
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password">
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 15px; margin-left: 310px;">
                    <button type="button" class="btn-secondary">CANCEL</button>
                    <button type="button" class="btn-primary">SAVE</button>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
