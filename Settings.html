<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NegosyoPro Settings</title>
    <link rel="stylesheet" href="DashboardCSS.css">
</head>
<body>
    <div class="dashboard-container">
        
        <div class="sidebar">
            <div class="sidebar-header">Business Name</div>
            <ul class="nav-menu">
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Sales/POS</a></li>
                <li><a href="#">Suppliers</a></li>
                <li><a href="#">Reports</a></li>
                <li class="active"><a href="#">Settings</a></li>
                <li><a href="#">My Account</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" class="logout-link">Logout</a>
                <span class="brand-text">NegosyoPro</span>
            </div>
        </div>

        <div class="main-content">
            <div class="top-header">
                <h1>Settings</h1>
                <div class="user-profile">
                    <span class="user-icon">(Icon Here)</span> Owner
                </div>
            </div>
            
            <div class="tabs-container">
                <div class="tab active">Basic Info</div>
                <div class="tab">Tax & Currency</div>
                <div class="tab">Payment Methods</div>
                <div class="tab">Discounts</div>
                <div class="tab">Inventory</div>
                <div class="tab">Users</div>
            </div>

            <form action="#">
                <div class="form-group">
                    <label>Business Name</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>Contact</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>Receipt Footer (optional)</label>
                    <input type="text">
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 10px;">SAVE</button>
            </form>

        </div>
    </div>
</body>
</html>
