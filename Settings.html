<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NegosyoPro Settings</title>
    <link rel="stylesheet" href="DashboardCSS.css" th:href="@{/DashboardCSS.css}">
</head>
<body>
    <div class="dashboard-container">
        
        <div class="sidebar">
            <div class="sidebar-header" th:text="${businessName}">Business Name</div>
            <ul class="nav-menu">
                <li><a href="#" th:href="@{/dashboard}">Dashboard</a></li>
                <li><a href="#" th:href="@{/products}">Products</a></li>
                <li><a href="#" th:href="@{/sales}">Sales/POS</a></li>
                <li><a href="#" th:href="@{/suppliers}">Suppliers</a></li>
                <li><a href="#" th:href="@{/reports}">Reports</a></li>
                <li class="active"><a href="#" th:href="@{/settings}">Settings</a></li>
                <li><a href="#" th:href="@{/my-account}">My Account</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" th:href="@{/logout}" class="logout-link">Logout</a>
                <span class="brand-text">NegosyoPro</span>
            </div>
        </div>

        <div class="main-content">
            <div class="top-header">
                <h1>Settings</h1>
                <div class="user-profile">
                    <span class="user-icon">(Icon Here)</span> Owner
                </div>
            </div>
            
            <div class="tabs-container">
                <div class="tab active">Basic Info</div>
                <div class="tab">Tax & Currency</div>
                <div class="tab">Payment Methods</div>
                <div class="tab">Discounts</div>
                <div class="tab">Inventory</div>
                <div class="tab">Users</div>
            </div>

            <form action="#" th:action="@{/settings}">
                <div class="form-group">
                    <label>Business Name</label>
                    <input type="text" th:value="${businessName}">
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" th:value="${address}">
                </div>
                <div class="form-group">
                    <label>Contact</label>
                    <input type="text" th:value="${contact}">
                </div>
                <div class="form-group">
                    <label>Receipt Footer (optional)</label>
                    <input type="text" th:value="${receiptFooter}">
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 10px;">SAVE</button>
            </form>

        </div>
    </div>
</body>
</html>
