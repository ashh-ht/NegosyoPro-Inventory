<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NegosyoPro Settings - Payment Methods</title>
    <link rel="stylesheet" href="DashboardCSS.css" th:href="@{/DashboardCSS.css}">
</head>
<body>
    <div class="dashboard-container">
        
        <div class="sidebar">
            <div class="sidebar-header" th:text="${businessName}">Business Name</div>
            <ul class="nav-menu">
                <li><a href="#" th:href="@{/dashboard}">Dashboard</a></li>
                <li><a href="#" th:href="@{/products}">Products</a></li>
                <li><a href="#" th:href="@{/sales}">Sales/POS</a></li>
                <li><a href="#" th:href="@{/suppliers}">Suppliers</a></li>
                <li><a href="#" th:href="@{/reports}">Reports</a></li>
                <li class="active"><a href="#" th:href="@{/settings}">Settings</a></li>
                <li><a href="#" th:href="@{/my-account}">My Account</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" th:href="@{/logout}" class="logout-link">Logout</a>
                <span class="brand-text">NegosyoPro</span>
            </div>
        </div>

        <div class="main-content">
            <div class="top-header">
                <h1>Settings</h1>
                <div class="user-profile">
                    <span class="user-icon">(Icon Here)</span> Owner
                </div>
            </div>
            
            <div class="tabs-container">
                <div class="tab">Basic Info</div>
                <div class="tab">Tax &amp; Currency</div>
                <div class="tab active">Payment Methods</div>
                <div class="tab">Discounts</div>
                <div class="tab">Inventory</div>
                <div class="tab">Users</div>
            </div>

            <div class="action-bar">
                <button class="btn-primary">Add Payment Method</button>
            </div>

            <div class="data-table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Method</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pm : ${paymentMethods}">
                            <td th:text="${pm.name}">Cash</td>
                            <td>
                                <label class="radio-pill">
                                    <input type="radio" th:name="${pm.name}" value="on" checked th:checked="${pm.enabled}"> ON
                                </label>
                            </td>
                        </tr>
                        <tr>
                            <td>Card</td>
                            <td>
                                <label class="radio-pill">
                                    <input type="radio" name="card" value="on" checked> ON
                                </label>
                            </td>
                        </tr>
                        <tr>
                            <td>E-Wallet</td>
                            <td>
                                <label class="radio-pill">
                                    <input type="radio" name="ewallet" value="off"> OFF
                                </label>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</body>
</html>
