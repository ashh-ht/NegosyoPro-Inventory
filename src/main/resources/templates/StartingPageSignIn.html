<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NegosyoPro Sign In</title>
    <link rel="stylesheet" href="StartingPageCSS.css">
</head>
<body>
    <div class="main-container">
        <div class="left-panel-SignIn">
            <h2>Sign In</h2>
            <form action="#">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">
                </div>
                <button type="submit" class="create-btn">Sign In</button>
            </form>
        </div>
        <div class="right-panel-SignIn">
            <h2>Welcome Back to NegosyoPro!</h2>
            <p>Do not have an account yet?</p>
            <button class="sign-in-btn">Create Account</button>
        </div>

        

    </div>
</body>
</html>
