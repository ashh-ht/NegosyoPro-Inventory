<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Receipt')}"></th:block>
</head>
<body class="receipt-body">
    <div class="receipt">
        <div class="center">
            <b style="font-size:18px" th:text="${business.businessName}">Store name</b><br>
            <span class="muted" th:text="${business.businessAddress}">Address</span><br>
            <span class="muted" th:text="${business.businessContact}">Contact</span>
        </div>
        <hr style="margin:12px 0;border:none;border-top:1px dashed #999">
        <div>
            Order <b th:text="${sale.orderNumber}">#0001</b><br>
            <span class="muted" th:text="${#temporals.format(sale.createdAt, 'yyyy-MM-dd HH:mm')}">date</span><br>
            <span th:if="${sale.customerName != null}" th:text="'Customer: ' + ${sale.customerName}">Customer</span>
        </div>
        <div th:if="${sale.status.name() != 'COMPLETED'}" style="margin-top:8px">
            <span class="badge red" th:text="${sale.status.name()}">CANCELLED</span>
        </div>

        <table>
            <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Total</th></tr></thead>
            <tbody>
            <tr th:each="i : ${items}">
                <td th:text="${i.productName}">Item</td>
                <td class="num" th:text="${i.quantity}">1</td>
                <td class="num" th:text="${#numbers.formatDecimal(i.unitPrice, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                <td class="num" th:text="${#numbers.formatDecimal(i.subtotal, 1, 'COMMA', 2, 'POINT')}">0.00</td>
            </tr>
            </tbody>
        </table>

        <div class="totals">
            <div><span>Subtotal</span><span><span th:replace="~{fragments/layout :: money(${sale.subtotal})}">0.00</span></span></div>
            <div th:if="${sale.discountAmount.signum() != 0}"><span>Discount</span><span>- <span th:replace="~{fragments/layout :: money(${sale.discountAmount})}">0.00</span></span></div>
            <div th:if="${business.taxEnabled}"><span th:text="${business.taxInclusive} ? 'VAT (included)' : 'VAT'">VAT</span><span><span th:replace="~{fragments/layout :: money(${sale.taxAmount})}">0.00</span></span></div>
            <div class="grand"><span>Total</span><span><span th:replace="~{fragments/layout :: money(${sale.totalAmount})}">0.00</span></span></div>
            <div><span>Paid</span><span><span th:replace="~{fragments/layout :: money(${sale.amountPaid})}">0.00</span></span></div>
            <div><span>Change</span><span><span th:replace="~{fragments/layout :: money(${sale.changeAmount})}">0.00</span></span></div>
        </div>

        <p class="center" style="margin-top:16px" th:text="${business.receiptFooter}">Thank you!</p>
    </div>

    <div class="receipt-actions">
        <a th:href="@{/sales}" class="btn-secondary">New sale</a>
        <button type="button" class="btn-primary" onclick="window.print()">Print</button>
        <a th:href="@{/dashboard}" class="btn-secondary">Dashboard</a>
    </div>
</body>
</html>
