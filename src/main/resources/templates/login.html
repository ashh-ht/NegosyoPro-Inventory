<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Sign in')}"></th:block>
</head>
<body class="auth-body">
    <div class="auth-card">
        <h1>NegosyoPro</h1>
        <p class="sub">Sign in to your business</p>

        <th:block th:replace="~{fragments/layout :: flash}"></th:block>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary">Sign in</button>
        </form>

        <p class="switch">New here? <a th:href="@{/setup}">Create your business</a></p>
    </div>
</body>
</html>
