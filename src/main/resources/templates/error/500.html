<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/layout :: head('Error')}"></th:block></head>
<body class="auth-body">
    <div class="auth-card">
        <h1>Something went wrong</h1>
        <p class="sub" th:text="${#strings.isEmpty(message)} ? 'An unexpected error happened. Please try again.' : ${message}">An unexpected error happened.</p>
        <a th:href="@{/dashboard}" class="btn-primary" style="text-align:center;text-decoration:none">Back to the dashboard</a>
    </div>
</body>
</html>
