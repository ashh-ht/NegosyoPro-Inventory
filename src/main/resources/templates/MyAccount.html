<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NegosyoPro My Account</title>
    <link rel="stylesheet" href="../static/css/DashboardCSS.css" th:href="@{/css/DashboardCSS.css}">
</head>
<body>
    <div class="dashboard-container">
        
        <div class="sidebar">
            <div class="sidebar-header" th:text="${businessName}">Business Name</div>
            <ul class="nav-menu">
                <li><a href="#" th:href="@{/dashboard}">Dashboard</a></li>
                <li><a href="#" th:href="@{/products}">Products</a></li>
                <li><a href="#" th:href="@{/sales}">Sales/POS</a></li>
                <li><a href="#" th:href="@{/suppliers}">Suppliers</a></li>
                <li><a href="#" th:href="@{/reports}">Reports</a></li>
                <li><a href="#" th:href="@{/settings}">Settings</a></li>
                <li class="active"><a href="#" th:href="@{/my-account}">My Account</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" th:href="@{/logout}" class="logout-link">Logout</a>
                <span class="brand-text">NegosyoPro</span>
            </div>
        </div>

        <div class="main-content">
            <div class="top-header">
                <h1>My Account</h1>
                <div class="user-profile">
                    <span class="user-icon">(Icon Here)</span> Owner
                </div>
            </div>
            
            <div class="form-section">
                <h2>Basic Information</h2>
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" th:value="${firstName}">
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" th:value="${lastName}">
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" th:value="${username}">
                </div>
                <div class="form-group">
                    <label>Role (View Only)</label>
                    <input type="text" disabled th:value="${role}">
                </div>
            </div>

            <div class="form-section">
                <h2>Change Password</h2>
                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" th:value="${currentPassword}">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" th:value="${newPassword}">
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" th:value="${confirmNewPassword}">
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 15px; margin-left: 310px;">
                    <button type="button" class="btn-secondary">CANCEL</button>
                    <button type="button" class="btn-primary">SAVE</button>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
