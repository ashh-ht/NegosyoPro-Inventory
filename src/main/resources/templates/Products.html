<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Products')}"></th:block>
</head>
<body>
<div class="dashboard-container">
    <div th:replace="~{fragments/layout :: sidebar('products')}"></div>

    <div class="main-content">
        <div th:replace="~{fragments/layout :: pagehead('Products')}"></div>
        <th:block th:replace="~{fragments/layout :: flash}"></th:block>

        <div class="toolbar">
            <!-- GET /products?q=...&categoryId=...  (the controller searches by text first, then by category) -->
            <form th:action="@{/products}" method="get">
                <input type="text" class="input-field bg-white" name="q" th:value="${q}" placeholder="Search name or code">
                <select class="input-field bg-white" name="categoryId">
                    <option value="">All categories</option>
                    <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"
                            th:selected="${selectedCategoryId != null and selectedCategoryId == c.categoryId}">Category</option>
                </select>
                <button type="submit" class="btn-secondary">Filter</button>
                <a th:href="@{/products}" class="btn-small">Clear</a>
            </form>
            <span class="spacer"></span>
            <th:block th:if="${me.role.name() == 'ADMIN'}">
                <a th:href="@{/admin/products/new}" class="btn-primary">+ Add product</a>
                <a th:href="@{/admin/categories}" class="btn-secondary">Categories</a>
                <a th:href="@{/admin/inventory}" class="btn-secondary">Inventory</a>
            </th:block>
        </div>

        <div class="tabs-container" data-tabs>
            <button type="button" class="tab" data-target="all">All</button>
            <button type="button" class="tab" data-target="low">Low stock</button>
            <button type="button" class="tab" data-target="out">Out of stock</button>
        </div>

        <div class="data-table-wrapper">
            <table class="data-table" id="productTable">
                <thead>
                <tr>
                    <th>Code</th><th>Name</th><th>Category</th><th class="num">Price</th><th class="num">Stock</th><th>Status</th>
                    <th th:if="${me.role.name() == 'ADMIN'}">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}"
                    th:with="status=${!p.trackInventory ? 'na' : (p.currentStock == 0 ? 'out' : (p.currentStock <= p.reorderLevel ? 'low' : 'ok'))}"
                    th:attr="data-status=${status}">
                    <td th:text="${p.productCode}">P001</td>
                    <td th:text="${p.productName}">Item</td>
                    <td th:text="${categories.^[categoryId == __${p.categoryId}__]?.categoryName} ?: '-'">Category</td>
                    <td class="num"><span th:replace="~{fragments/layout :: money(${p.sellingPrice})}">0.00</span></td>
                    <td class="num" th:text="${p.trackInventory ? p.currentStock + ' ' + p.unit : '-'}">12</td>
                    <td>
                        <span class="badge green" th:if="${status == 'ok'}">In stock</span>
                        <span class="badge orange" th:if="${status == 'low'}">Low</span>
                        <span class="badge red" th:if="${status == 'out'}">Out</span>
                        <span class="badge" th:if="${status == 'na'}">Not tracked</span>
                    </td>
                    <td th:if="${me.role.name() == 'ADMIN'}">
                        <a th:href="@{/admin/products/{id}/edit(id=${p.productId})}" class="btn-small">Edit</a>
                        <a th:if="${p.trackInventory}" th:href="@{/admin/inventory/{id}(id=${p.productId})}" class="btn-small">Stock</a>
                        <form class="inline-form" th:action="@{/admin/products/{id}/active(id=${p.productId})}" method="post"
                              onsubmit="return confirm('Deactivate this product? It will no longer be sold.')">
                            <input type="hidden" name="active" value="false">
                            <button type="submit" class="btn-small">Deactivate</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="empty" th:if="${#lists.isEmpty(products)}">No products found.</div>
        </div>
        <p class="muted">Expired and expiring batches are on the <a th:if="${me.role.name() == 'ADMIN'}" th:href="@{/admin/inventory}">Inventory</a><span th:unless="${me.role.name() == 'ADMIN'}">Inventory</span> page (admins).</p>
    </div>
</div>

<script th:src="@{/js/charts.js}"></script>
<script>
    // The tab buttons (charts.js) only mark the active tab; this hides the rows that do not match.
    document.addEventListener('DOMContentLoaded', function () {
        var tabs = document.querySelectorAll('[data-tabs] .tab');
        function filter(which) {
            document.querySelectorAll('#productTable tbody tr').forEach(function (row) {
                var s = row.dataset.status;
                row.style.display = (which === 'all' || (which === 'low' && (s === 'low' || s === 'out')) || (which === 'out' && s === 'out')) ? '' : 'none';
            });
        }
        tabs.forEach(function (t) { t.addEventListener('click', function () { filter(t.dataset.target); }); });
    });
</script>
</body>
</html>
