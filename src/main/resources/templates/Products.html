<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NegosyoPro Products</title>
    <link rel="stylesheet" href="../static/css/DashboardCSS.css">
</head>
<body>
    <div class="dashboard-container">
        
        <div class="sidebar">
            <div class="sidebar-header">Business Name</div>
            <ul class="nav-menu">
                <li><a href="#">Dashboard</a></li>
                <li class="active"><a href="#">Products</a></li>
                <li><a href="#">Sales/POS</a></li>
                <li><a href="#">Suppliers</a></li>
                <li><a href="#">Reports</a></li>
                <li><a href="#">Settings</a></li>
                <li><a href="#">My Account</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" class="logout-link">Logout</a>
                <span class="brand-text">NegosyoPro</span>
            </div>
        </div>

        <div class="main-content">
            <div class="top-header">
                <h1>Products</h1>
                <div class="user-profile">
                    <span class="user-icon">(Icon Here)</span> Owner
                </div>
            </div>
            
            <div class="action-bar">
                <input type="text" class="input-field" placeholder="Search">
                <select class="input-field">
                    <option>Category</option>
                </select>
                <button class="btn-primary">+ Add Product</button>
                <button class="btn-primary">Manage Categories</button>
            </div>

            <div class="tabs-container">
                <div class="tab active">All</div>
                <div class="tab">Low</div>
                <div class="tab">Out</div>
                <div class="tab">Expiring</div>
            </div>

            <div class="data-table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>P001</td>
                            <td>Item name</td>
                            <td>Category</td>
                            <td>0.00</td>
                            <td>12</td>
                            <td class="status-green">In stock</td>
                            <td>
                                <button class="btn-small">Edit</button>
                                <button class="btn-small">Stock</button>
                                <button class="btn-small">History</button>
                            </td>
                        </tr>
                        <tr>
                            <td>P002</td>
                            <td>Item name</td>
                            <td>Category</td>
                            <td>0.00</td>
                            <td>2</td>
                            <td class="status-orange">Low</td>
                            <td>
                                <button class="btn-small">Edit</button>
                                <button class="btn-small">Stock</button>
                                <button class="btn-small">History</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</body>
</html>
