<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NegosyoPro Products</title>
    <link rel="stylesheet" href="../static/css/DashboardCSS.css" th:href="@{/css/DashboardCSS.css}">
</head>
<body>
    <div class="dashboard-container">
        
        <div class="sidebar">
            <div class="sidebar-header" th:text="${businessName}">Business Name</div>
            <ul class="nav-menu">
                <li><a href="#" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="active"><a href="#" th:href="@{/products}">Products</a></li>
                <li><a href="#" th:href="@{/sales}">Sales/POS</a></li>
                <li><a href="#" th:href="@{/suppliers}">Suppliers</a></li>
                <li><a href="#" th:href="@{/reports}">Reports</a></li>
                <li><a href="#" th:href="@{/settings}">Settings</a></li>
                <li><a href="#" th:href="@{/my-account}">My Account</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" th:href="@{/logout}" class="logout-link">Logout</a>
                <span class="brand-text">NegosyoPro</span>
            </div>
        </div>

        <div class="main-content">
            <div class="top-header">
                <h1>Products</h1>
                <div class="user-profile">
                    <span class="user-icon">(Icon Here)</span> Owner
                </div>
            </div>
            
            <div class="action-bar">
                <input type="text" class="input-field" placeholder="Search" th:value="${searchQuery}">
                <select class="input-field">
                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">Category</option>
                </select>
                <button class="btn-primary">+ Add Product</button>
                <button class="btn-primary">Manage Categories</button>
            </div>

            <div class="tabs-container">
                <div class="tab active">All</div>
                <div class="tab">Low</div>
                <div class="tab">Out</div>
                <div class="tab">Expiring</div>
            </div>

            <div class="data-table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products}">
                            <td th:text="${product.code}">P001</td>
                            <td th:text="${product.name}">Item name</td>
                            <td th:text="${product.category}">Category</td>
                            <td th:text="${product.price}">0.00</td>
                            <td th:text="${product.stock}">12</td>
                            <td class="status-green" th:text="${product.status}">In stock</td>
                            <td>
                                <button class="btn-small">Edit</button>
                                <button class="btn-small">Stock</button>
                                <button class="btn-small">History</button>
                            </td>
                        </tr>
                        <tr>
                            <td>P002</td>
                            <td>Item name</td>
                            <td>Category</td>
                            <td>0.00</td>
                            <td>2</td>
                            <td class="status-orange">Low</td>
                            <td>
                                <button class="btn-small">Edit</button>
                                <button class="btn-small">Stock</button>
                                <button class="btn-small">History</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</body>
</html>
