<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NegosyoPro Suppliers</title>
    <link rel="stylesheet" href="../static/css/DashboardCSS.css" th:href="@{/css/DashboardCSS.css}">
</head>
<body>
    <div class="dashboard-container">
        
        <div class="sidebar">
            <div class="sidebar-header" th:text="${businessName}">Business Name</div>
            <ul class="nav-menu">
                <li><a href="#" th:href="@{/dashboard}">Dashboard</a></li>
                <li><a href="#" th:href="@{/products}">Products</a></li>
                <li><a href="#" th:href="@{/sales}">Sales/POS</a></li>
                <li class="active"><a href="#" th:href="@{/suppliers}">Suppliers</a></li>
                <li><a href="#" th:href="@{/reports}">Reports</a></li>
                <li><a href="#" th:href="@{/settings}">Settings</a></li>
                <li><a href="#" th:href="@{/my-account}">My Account</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" th:href="@{/logout}" class="logout-link">Logout</a>
                <span class="brand-text">NegosyoPro</span>
            </div>
        </div>

        <div class="main-content">
            <div class="top-header">
                <h1>Suppliers</h1>
                <div class="user-profile">
                    <span class="user-icon">(Icon Here)</span> Owner
                </div>
            </div>
            
            <div class="tabs-container">
                <div class="tab active">Suppliers</div>
                <div class="tab">Purchase Orders</div>
                <div class="tab">Restock Suggestions</div>
            </div>

            <div class="action-bar">
                <button class="btn-primary">Add Suppliers</button>
            </div>

            <div class="data-table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Supplier</th>
                            <th>Contact</th>
                            <th>Products</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="supplier : ${suppliers}">
                            <td th:text="${supplier.name}">Name</td>
                            <td th:text="${supplier.contact}">phone/email</td>
                            <td th:text="${supplier.products}">#</td>
                            <td><button class="btn-small">View</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</body>
</html>
