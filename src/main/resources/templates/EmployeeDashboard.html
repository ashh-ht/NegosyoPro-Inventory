<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NegosyoPro Employee Dashboard</title>
    <link rel="stylesheet" href="../static/css/DashboardCSS.css" th:href="@{/css/DashboardCSS.css}">
</head>
<body>
    <div class="dashboard-container">
        
        <div class="sidebar">
            <div class="sidebar-header" th:text="${businessName}">Business Name</div>
            <ul class="nav-menu">
                <li class="active"><a href="#" th:href="@{/employee/dashboard}">Dashboard</a></li>
                <li><a href="#" th:href="@{/employee/products}">Products</a></li>
                <li><a href="#" th:href="@{/employee/sales}">Sales/POS</a></li>
                <li><a href="#" th:href="@{/employee/my-account}">My Account</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" th:href="@{/logout}" class="logout-link">Logout</a>
                <span class="brand-text">NegosyoPro</span>
            </div>
        </div>

        <div class="main-content">
            <div class="top-header">
                <h1>Dashboard</h1>
                <div class="user-profile">
                    <span class="user-icon">(Icon Here)</span> Employee
                </div>
            </div>

            <button class="new-sales-btn">+ New Sales</button>

            <div class="stats-grid">
                <div class="stat-card emp-card">
                    <div class="stat-title">SALES TODAY</div>
                    <div class="stat-value" th:text="${salesToday}"></div>
                </div>
                <div class="stat-card emp-card">
                    <div class="stat-title">TRANSACTIONS TODAY</div>
                    <div class="stat-value" th:text="${transactionsToday}"></div>
                </div>
                <div class="stat-card emp-card">
                    <div class="stat-title">PRODUCTS AND LOW STOCK</div>
                    <div class="stat-value" th:text="${lowStockCount}"></div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card graph-wide">
                    <div class="stat-title">GRAPH</div>
                    <div class="graph-placeholder" th:text="${graphData}">INSERT GRAPH HERE</div>
                </div>
                <div class="stat-card emp-card">
                    <div class="stat-title">TOP PRODUCTS</div>
                    <div class="stat-value" th:text="${topProducts}"></div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card emp-card">
                    <div class="stat-title">LOW-STOCK LIST</div>
                    <div class="stat-value" th:text="${lowStockList}"></div>
                </div>
                <div class="stat-card emp-card">
                    <div class="stat-title">OUT-OF-STOCK LIST</div>
                    <div class="stat-value" th:text="${outOfStockList}"></div>
                </div>
                <div class="stat-card emp-card">
                    <div class="stat-title">EXPIRING SOON</div>
                    <div class="stat-value" th:text="${expiringSoonList}"></div>
                </div>
            </div>

            <button class="view-inventory">View Inventory</button>

        </div>
    </div>
</body>
</html>
