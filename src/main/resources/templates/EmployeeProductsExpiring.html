<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NegosyoPro Employee Products - Expiring</title>
    <link rel="stylesheet" href="../static/css/DashboardCSS.css" th:href="@{/DashboardCSS.css}">
</head>
<body>
    <div class="dashboard-container">
        
        <div class="sidebar">
            <div class="sidebar-header" th:text="${businessName}">Business Name</div>
            <ul class="nav-menu">
                <li><a href="#" th:href="@{/employee/dashboard}">Dashboard</a></li>
                <li class="active"><a href="#" th:href="@{/employee/products}">Products</a></li>
                <li><a href="#" th:href="@{/employee/sales}">Sales/POS</a></li>
                <li><a href="#" th:href="@{/employee/my-account}">My Account</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" th:href="@{/logout}" class="logout-link">Logout</a>
                <span class="brand-text">NegosyoPro</span>
            </div>
        </div>

        <div class="main-content">
            <div class="top-header">
                <h1>Products</h1>
                <div class="user-profile">
                    <span class="user-icon">(Icon Here)</span> Employee
                </div>
            </div>
            
            <div class="action-bar">
                <input type="text" class="input-field bg-white" placeholder="Search" th:value="${searchQuery}">
                <input type="text" class="input-field bg-white" placeholder="Category" th:value="${categoryQuery}">
            </div>

            <div class="tabs-container">
                <div class="tab">All</div>
                <div class="tab">Low</div>
                <div class="tab">Out</div>
                <div class="tab active">Expiring</div>
            </div>

            <div class="data-table-wrapper emp-table-wrapper">
                <table class="data-table emp-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Batch</th>
                            <th>Quantity Left</th>
                            <th>Expiry</th>
                            <th>Days Left</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${expiringProducts}">
                            <td th:text="${item.productName}">Item Name</td>
                            <td th:text="${item.batch}">B-##</td>
                            <td th:text="${item.qtyLeft}">##</td>
                            <td th:text="${item.expiry}">00/00/00</td>
                            <td th:text="${item.daysLeft}">##</td>
                            <td th:text="${item.action}">NONE</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</body>
</html>
