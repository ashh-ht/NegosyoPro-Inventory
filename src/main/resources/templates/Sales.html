<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Sales / POS')}"></th:block>
</head>
<body>
<div class="dashboard-container">
    <div th:replace="~{fragments/layout :: sidebar('sales')}"></div>

    <div class="main-content">
        <div th:replace="~{fragments/layout :: pagehead('Sales / POS')}"></div>
        <th:block th:replace="~{fragments/layout :: flash}"></th:block>

        <!-- POST /sales/checkout reads: paymentMethodId, amountPaid, discountId, customerName, customerContact,
             and one productId + one quantity per cart line (same names repeated, so they arrive as lists). -->
        <form id="posForm" th:action="@{/sales/checkout}" method="post">
            <div class="pos-grid">

                <div>
                    <div class="card">
                        <h3>Add an item</h3>
                        <div class="toolbar" style="margin-bottom:0">
                            <select id="picker" class="input-field bg-white" style="flex:1;min-width:220px">
                                <option value="">Choose a product...</option>
                                <option th:each="p : ${products}" th:value="${p.productId}"
                                        th:attr="data-name=${p.productName},data-price=${p.sellingPrice},data-stock=${p.trackInventory ? p.currentStock : -1}"
                                        th:text="${p.productName + ' - ' + p.sellingPrice + (p.trackInventory ? ' (' + p.currentStock + ' in stock)' : '')}">Item</option>
                            </select>
                            <input type="number" id="pickQty" class="qty-input" value="1" min="1">
                            <button type="button" class="btn-primary" id="addBtn">Add</button>
                        </div>
                        <p class="muted" style="margin-top:8px" th:if="${#lists.isEmpty(products)}">Nothing is available to sell yet. Add products and restock them first.</p>
                    </div>

                    <div class="data-table-wrapper">
                        <table class="data-table">
                            <thead><tr><th>Item</th><th class="num">Price</th><th>Qty</th><th class="num">Line</th><th></th></tr></thead>
                            <tbody id="cartBody"></tbody>
                        </table>
                        <div class="empty" id="cartEmpty">The cart is empty.</div>
                    </div>
                </div>

                <div class="card">
                    <h3>Checkout</h3>

                    <div class="form-group">
                        <label for="discountId">Discount</label>
                        <select id="discountId" name="discountId">
                            <option value="" data-pct="0">No discount</option>
                            <option th:each="d : ${discounts}" th:value="${d.discountId}"
                                    th:attr="data-requires-id=${d.requiresId}"
                                    th:text="${d.discountName + ' (' + d.discountPercent + '%)' + (d.requiresId ? ' - ID required' : '')}">Senior</option>
                        </select>
                        <span class="hint" id="idHint" style="display:none;color:#92400e">Check the customer's ID before applying this discount.</span>
                    </div>

                    <div class="form-group">
                        <label for="paymentMethodId">Payment method</label>
                        <select id="paymentMethodId" name="paymentMethodId" required>
                            <option th:each="m : ${paymentMethods}" th:value="${m.paymentMethodId}" th:text="${m.methodName}">Cash</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="customerName">Customer name <span class="optional-text">(optional)</span></label>
                        <input type="text" id="customerName" name="customerName">
                    </div>
                    <div class="form-group">
                        <label for="customerContact">Contact <span class="optional-text">(optional)</span></label>
                        <input type="text" id="customerContact" name="customerContact">
                    </div>

                    <div class="checkout-summary-box">
                        Total
                        <div class="pos-total"><span th:text="${business.currencySymbol}">P</span> <span id="totalText">0.00</span></div>
                        <div class="muted" th:text="${business.taxEnabled} ? (${business.taxInclusive} ? 'Prices include tax.' : 'Tax is added at checkout.') : 'No tax.'">Prices include tax.</div>
                    </div>

                    <div class="form-group">
                        <label for="amountPaid">Amount paid</label>
                        <input type="number" id="amountPaid" name="amountPaid" min="0" step="0.01" value="0" required>
                    </div>
                    <div class="change-text">Change: <span th:text="${business.currencySymbol}">P</span> <span id="changeText">0.00</span></div>
                    <div class="stock-note" th:text="${business.usesExpiry} ? 'Stock is deducted automatically, earliest expiry first.' : 'Stock is deducted automatically.'">Stock is deducted automatically.</div>

                    <div class="actions">
                        <button type="button" class="btn-secondary" id="clearBtn">Clear</button>
                        <button type="submit" class="btn-primary" id="completeBtn" disabled>Complete sale</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    var PREVIEW_URL = /*[[@{/sales/preview}]]*/ '/sales/preview';
    /*]]>*/

    (function () {
        var form = document.getElementById('posForm');
        var picker = document.getElementById('picker');
        var body = document.getElementById('cartBody');
        var empty = document.getElementById('cartEmpty');
        var totalText = document.getElementById('totalText');
        var changeText = document.getElementById('changeText');
        var paid = document.getElementById('amountPaid');
        var complete = document.getElementById('completeBtn');
        var discount = document.getElementById('discountId');
        var total = 0;

        function money(n) { return (Math.round(n * 100) / 100).toFixed(2); }

        function lineCount() { return body.querySelectorAll('tr').length; }

        function refreshLines() {
            body.querySelectorAll('tr').forEach(function (tr) {
                var q = parseInt(tr.querySelector('input[name=quantity]').value, 10) || 0;
                tr.querySelector('.line').textContent = money(q * parseFloat(tr.dataset.price));
            });
            empty.style.display = lineCount() ? 'none' : '';
        }

        function refreshChange() {
            var change = (parseFloat(paid.value) || 0) - total;
            changeText.textContent = money(change > 0 ? change : 0);
            complete.disabled = lineCount() === 0 || (parseFloat(paid.value) || 0) < total - 0.001;
        }

        // The server works out tax, discount and total (POST /sales/preview), so the number here matches the receipt.
        function refreshTotal() {
            refreshLines();
            if (!lineCount()) { total = 0; totalText.textContent = '0.00'; refreshChange(); return; }
            fetch(PREVIEW_URL, { method: 'POST', body: new URLSearchParams(new FormData(form)) })
                .then(function (r) { return r.text(); })
                .then(function (t) { total = parseFloat(t) || 0; totalText.textContent = money(total); refreshChange(); });
        }

        document.getElementById('addBtn').addEventListener('click', function () {
            var opt = picker.options[picker.selectedIndex];
            var qty = parseInt(document.getElementById('pickQty').value, 10);
            if (!opt.value || !(qty > 0)) { return; }
            var stock = parseInt(opt.dataset.stock, 10);
            // Same product again: add to the quantity instead of a second row.
            var existing = body.querySelector('tr[data-id="' + opt.value + '"]');
            if (existing) {
                var qi = existing.querySelector('input[name=quantity]');
                qi.value = (parseInt(qi.value, 10) || 0) + qty;
            } else {
                var tr = document.createElement('tr');
                tr.dataset.id = opt.value;
                tr.dataset.price = opt.dataset.price;
                tr.innerHTML =
                    '<td></td><td class="num"></td>' +
                    '<td><input type="number" name="quantity" class="qty-input" min="1"></td>' +
                    '<td class="num line">0.00</td>' +
                    '<td><button type="button" class="btn-small danger remove">x</button></td>';
                tr.children[0].textContent = opt.dataset.name;
                var hid = document.createElement('input');
                hid.type = 'hidden'; hid.name = 'productId'; hid.value = opt.value;
                tr.children[0].appendChild(hid);
                tr.children[1].textContent = money(parseFloat(opt.dataset.price));
                var qin = tr.querySelector('input[name=quantity]');
                qin.value = qty;
                if (stock >= 0) { qin.max = stock; }
                body.appendChild(tr);
            }
            picker.selectedIndex = 0;
            document.getElementById('pickQty').value = 1;
            refreshTotal();
        });

        body.addEventListener('input', refreshTotal);
        body.addEventListener('click', function (e) {
            if (e.target.classList.contains('remove')) { e.target.closest('tr').remove(); refreshTotal(); }
        });
        discount.addEventListener('change', function () {
            var opt = discount.options[discount.selectedIndex];
            document.getElementById('idHint').style.display = opt.dataset.requiresId === 'true' ? '' : 'none';
            refreshTotal();
        });
        paid.addEventListener('input', refreshChange);
        document.getElementById('clearBtn').addEventListener('click', function () {
            body.innerHTML = ''; paid.value = 0; refreshTotal();
        });
        form.addEventListener('submit', function (e) { if (!lineCount()) { e.preventDefault(); } });
        refreshTotal();
    })();
</script>
</body>
</html>
