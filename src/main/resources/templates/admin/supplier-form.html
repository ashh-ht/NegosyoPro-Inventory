<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Edit supplier')}"></th:block>
</head>
<body>
<div class="dashboard-container">
    <div th:replace="~{fragments/layout :: sidebar('suppliers')}"></div>

    <div class="main-content">
        <div th:replace="~{fragments/layout :: pagehead('Edit supplier')}"></div>
        <th:block th:replace="~{fragments/layout :: flash}"></th:block>

        <!-- POST /admin/suppliers/{id}. "active" defaults to true in the controller, so a select sends it explicitly
             (an unchecked checkbox would send nothing and silently re-activate the supplier). -->
        <form class="card" th:action="@{/admin/suppliers/{id}(id=${supplier.supplierId})}" method="post">
            <div class="form-grid">
                <div class="form-group"><label for="supplierName">Supplier name</label>
                    <input type="text" id="supplierName" name="supplierName" th:value="${supplier.supplierName}" required></div>
                <div class="form-group"><label for="contactPerson">Contact person</label>
                    <input type="text" id="contactPerson" name="contactPerson" th:value="${supplier.contactPerson}"></div>
                <div class="form-group"><label for="contactNumber">Phone</label>
                    <input type="text" id="contactNumber" name="contactNumber" th:value="${supplier.contactNumber}"></div>
                <div class="form-group"><label for="email">Email</label>
                    <input type="email" id="email" name="email" th:value="${supplier.email}"></div>
                <div class="form-group"><label for="address">Address</label>
                    <input type="text" id="address" name="address" th:value="${supplier.address}"></div>
                <div class="form-group"><label for="active">Status</label>
                    <select id="active" name="active">
                        <option value="true" th:selected="${supplier.active}">Active</option>
                        <option value="false" th:selected="${!supplier.active}">Inactive</option>
                    </select></div>
            </div>
            <div class="actions">
                <button type="submit" class="btn-primary">Save</button>
                <a th:href="@{/admin/suppliers}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
