<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Purchase orders')}"></th:block>
</head>
<body>
<div class="dashboard-container">
    <div th:replace="~{fragments/layout :: sidebar('orders')}"></div>

    <div class="main-content">
        <div th:replace="~{fragments/layout :: pagehead('Purchase orders')}"></div>
        <th:block th:replace="~{fragments/layout :: flash}"></th:block>

        <div class="toolbar">
            <!-- GET /admin/purchase-orders?status=DRAFT|ORDERED|RECEIVED|CANCELLED (no status = all) -->
            <form th:action="@{/admin/purchase-orders}" method="get">
                <select name="status" class="input-field bg-white" onchange="this.form.submit()">
                    <option value="">All statuses</option>
                    <option value="DRAFT" th:selected="${status != null and status.name() == 'DRAFT'}">Draft</option>
                    <option value="ORDERED" th:selected="${status != null and status.name() == 'ORDERED'}">Ordered</option>
                    <option value="RECEIVED" th:selected="${status != null and status.name() == 'RECEIVED'}">Received</option>
                    <option value="CANCELLED" th:selected="${status != null and status.name() == 'CANCELLED'}">Cancelled</option>
                </select>
            </form>
            <span class="spacer"></span>
            <a th:href="@{/admin/purchase-orders/new}" class="btn-primary">+ Create purchase order</a>
        </div>

        <div class="data-table-wrapper">
            <table class="data-table">
                <thead><tr><th>PO #</th><th>Supplier</th><th>Status</th><th>Ordered</th><th>Expected</th><th></th></tr></thead>
                <tbody>
                <tr th:each="o : ${orders}">
                    <td th:text="${o.poNumber}">PO-0001</td>
                    <td th:text="${suppliers.^[supplierId == __${o.supplierId}__]?.supplierName} ?: ('Supplier #' + ${o.supplierId})">Supplier</td>
                    <td>
                        <span class="badge" th:classappend="${o.status.name() == 'RECEIVED'} ? 'green' : (${o.status.name() == 'ORDERED'} ? 'blue' : (${o.status.name() == 'CANCELLED'} ? 'red' : ''))"
                              th:text="${o.status.name()}">DRAFT</span>
                    </td>
                    <td th:text="${#temporals.format(o.orderedAt, 'yyyy-MM-dd')}">-</td>
                    <td th:text="${#temporals.format(o.expectedArrival, 'yyyy-MM-dd')}">-</td>
                    <td><a th:href="@{/admin/purchase-orders/{id}(id=${o.purchaseOrderId})}" class="btn-small primary">View</a></td>
                </tr>
                </tbody>
            </table>
            <div class="empty" th:if="${#lists.isEmpty(orders)}">No purchase orders.</div>
        </div>
    </div>
</div>
</body>
</html>
